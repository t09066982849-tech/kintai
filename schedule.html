<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スケジュール</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h2>スケジュール</h2>

<div id="login-box" style="display:none">
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">
  <button onclick="login()">ログイン</button>
  <p id="login-error" style="color:red"></p>
</div>

<div id="main-box" style="display:none">
  <p id="welcome"></p>
  <div class="nav-links">
    <a href="index.html" class="nav-link">勤怠</a>
    <a href="schedule.html" class="nav-link active">スケジュール</a>
    <a href="leave.html" class="nav-link">申請</a>
    <a href="admin.html" class="nav-link" id="nav-admin-link" style="display:none">管理</a>
  </div>
  <button style="background:#9ca3af" onclick="logout()">ログアウト</button>

  <div class="month-nav">
    <button onclick="changeMonth(-1)">← 前月</button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)">次月 →</button>
  </div>

  <div class="calendar" id="calendar"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">予定を追加</h3>
    <p id="modal-date-label"></p>

    <div id="event-view" style="display:none">
      <p><strong id="view-title"></strong></p>
      <p id="view-employee"></p>
      <p id="view-members"></p>
      <p id="view-period"></p>
      <p id="view-time"></p>
      <button id="view-edit-btn" onclick="startEdit()">編集</button>
      <button id="view-delete-btn" style="background:#dc2626" onclick="deleteCurrentEvent()">削除</button>
      <button style="background:#9ca3af" onclick="closeModal()">閉じる</button>
    </div>

    <div id="event-form" style="display:none">
      <label>件名</label>
      <input type="text" id="new-title" placeholder="例:○○現場打合せ">

      <label>終了日(複数日にまたがる場合のみ)</label>
      <input type="date" id="new-end-date">

      <label style="display:flex; align-items:center; gap:8px; width:auto;">
        <input type="checkbox" id="new-allday" style="width:auto; margin:0;" checked onchange="toggleAllday()">
        終日
      </label>

      <div id="time-fields" style="display:none">
        <label>開始時刻</label>
        <input type="time" id="new-start">
        <label>終了時刻</label>
        <input type="time" id="new-end">
      </div>

      <label>参加メンバー</label>
      <div id="member-checkboxes" style="max-height:150px; overflow-y:auto; border:1px solid #ddd; border-radius:6px; padding:8px;"></div>

      <button id="save-btn" onclick="addEvent()">追加</button>
      <button style="background:#9ca3af" onclick="closeModal()">キャンセル</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="schedule.js"></script>
</body>
</html>
