<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申請書類</title>
<style>
  body { font-family: "Hiragino Mincho ProN", serif; max-width: 700px; margin: 30px auto; padding: 0 16px; color: #1a1a1a; }
  .doc-title { text-align: center; font-size: 22px; font-weight: bold; letter-spacing: 8px; margin-bottom: 30px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  td, th { border: 1px solid #444; padding: 8px 10px; font-size: 14px; vertical-align: middle; }
  th { background: #f3f4f6; width: 110px; text-align: left; }
  .approval-table td { text-align: center; height: 90px; }
  .approval-table th { text-align: center; }
  .seal { width: 54px; height: 54px; border: 2px solid #b3271f; color: #b3271f; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin: 0 auto; }
  .doc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .doc-header-to { font-size: 15px; }
  .doc-header-seals { display: flex; gap: 8px; align-items: center; }
  .doc-header-seals .seal-label { font-size: 10px; color: #555; text-align: center; margin-bottom: 2px; }
  .seal-sm { width: 34px; height: 34px; border: 1.5px solid #b3271f; color: #b3271f; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; margin: 0 auto; }
  .multi-col td, .multi-col th { width: auto; }
  .print-btn { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .note { color: #b91c1c; margin-top: 20px; }
  @media print { .print-btn { display: none; } }
</style>
</head>
<body>
<div id="content">読み込み中...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script src="document.js"></script>
</body>
</html>
