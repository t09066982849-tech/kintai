<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理(管理者)</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<h2>勤怠管理(管理者)</h2>

<div id="login-box" style="display:none">
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">
  <button onclick="login()">ログイン</button>
  <p id="login-error" style="color:red"></p>
</div>

<div id="main-box" style="display:none">
  <p id="welcome"></p>
  <div class="nav-links">
    <a href="index.html" class="nav-link">勤怠</a>
    <a href="schedule.html" class="nav-link">スケジュール</a>
    <a href="leave.html" class="nav-link">申請</a>
    <a href="admin.html" class="nav-link active">管理</a>
  </div>
  <button style="background:#9ca3af" onclick="logout()">ログアウト</button>

  <details open>
    <summary>修正申請一覧(申請中)</summary>
    <table>
      <thead><tr><th>従業員</th><th>日付</th><th>現在の現場</th><th>現在の出勤</th><th>現在の退勤</th><th>希望の現場</th><th>希望の出勤</th><th>希望の退勤</th><th>操作</th></tr></thead>
      <tbody id="requests-body"></tbody>
    </table>
  </details>

  <details>
    <summary>本日の打刻状況</summary>
    <button onclick="loadTodayStatus()">更新</button>
    <table>
      <thead><tr><th>氏名</th><th>部署</th><th>現場</th><th>出勤時刻</th><th>退勤時刻</th><th>状態</th></tr></thead>
      <tbody id="today-status-body"></tbody>
    </table>
  </details>

  <details>
    <summary>Excel出力</summary>
    <input type="month" id="export-month">
    <label style="display:flex; align-items:center; gap:8px; width:auto;">
      <input type="checkbox" id="export-include-daily" checked style="width:auto; margin:0;">
      個人別シートを含める
    </label>
    <button onclick="exportExcel()">この月のデータをExcelでダウンロード</button>
  </details>

  <details>
    <summary>年間集計Excel出力(6月始まり年度)</summary>
    <label>開始年(西暦)</label>
    <input type="number" id="annual-start-year">
    <button onclick="exportAnnualSummary()">12ヶ月分の集計をExcelでダウンロード</button>
  </details>

  <details>
    <summary>打刻記録の追加申請</summary>
    <table>
      <thead><tr><th>従業員</th><th>日付</th><th>現場</th><th>希望出勤時刻</th><th>希望退勤時刻</th><th>操作</th></tr></thead>
      <tbody id="missing-requests-body"></tbody>
    </table>
  </details>

  <details>
    <summary>有給・出張申請(承認待ち)</summary>
    <table>
      <thead><tr><th>従業員</th><th>種類</th><th>期間</th><th>日数</th><th>現在の段階</th></tr></thead>
      <tbody id="pending-leave-body"></tbody>
    </table>
  </details>

  <details>
    <summary>承認済み申請書類</summary>
    <table>
      <thead><tr><th>従業員</th><th>種類</th><th>期間</th><th>操作</th></tr></thead>
      <tbody id="approved-leave-body"></tbody>
    </table>
  </details>

  <details>
    <summary>現場管理</summary>
    <input id="new-site-name" placeholder="現場名">
    <button onclick="addSite()">追加</button>
    <table>
      <thead><tr><th>現場名</th><th>状態</th><th>操作</th></tr></thead>
      <tbody id="sites-body"></tbody>
    </table>
  </details>

  <details>
    <summary>新規従業員登録</summary>
    <label>氏名</label>
    <input id="new-emp-name" placeholder="例:山田 太郎">
    <label>メールアドレス</label>
    <input id="new-emp-email" type="email" placeholder="例:yamada@izukura.co.jp">
    <label>初期パスワード</label>
    <input id="new-emp-password" type="text" placeholder="本人に伝えるパスワード">
    <label>部署</label>
    <select id="new-emp-department">
      <option value="civil">土木部</option>
      <option value="accounting">経理部</option>
    </select>
    <button onclick="createEmployee()">登録する</button>
    <p id="create-emp-message"></p>
  </details>

  <details>
    <summary>従業員一覧</summary>
    <table>
      <thead><tr><th>氏名</th><th>部署</th><th>残り有給日数</th><th>状態</th><th>操作</th></tr></thead>
      <tbody id="employees-body"></tbody>
    </table>
  </details>
</div>

<div class="modal-bg" id="employee-detail-modal-bg">
  <div class="modal">
    <h3 id="employee-detail-name"></h3>
    <p id="employee-detail-month"></p>
    <table>
      <thead><tr><th>日付</th><th>現場</th><th>出勤</th><th>退勤</th><th>勤務時間</th><th>残業時間</th></tr></thead>
      <tbody id="employee-detail-body"></tbody>
    </table>
    <button style="background:#9ca3af" onclick="closeEmployeeDetail()">閉じる</button>
  </div>
</div>

<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
