<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h2>勤怠管理</h2>

<div id="login-box" style="display:none">
  <input id="email" type="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード">
  <button onclick="login()">ログイン</button>
  <p id="login-error" style="color:red"></p>
</div>

<div id="main-box" style="display:none">
  <p id="welcome"></p>
  <div style="display:flex; gap:16px; font-size:28px; font-weight:bold; margin:8px 0;">
    <span id="paid-leave-balance"></span>
    <span id="overtime-summary"></span>
  </div>
  <p id="current-time" style="font-size:24px; font-weight:bold; margin:8px 0;"></p>
  <div class="nav-links">
   <a href="index.html" class="nav-link active">勤怠</a>
    <a href="schedule.html" class="nav-link">スケジュール</a>
    <a href="leave.html" class="nav-link">申請</a>
    <a href="admin.html" class="nav-link" id="nav-admin-link" style="display:none">管理</a>
  </div>
  <button style="background:#9ca3af" onclick="logout()">ログアウト</button>
  <select id="site-select"></select>
  <button id="action-btn"></button>
  <p id="status"></p>

  <h3>履歴</h3>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">← 前月</button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)">次月 →</button>
  </div>
  <table>
    <thead><tr><th>日付</th><th>現場</th><th>出勤</th><th>退勤</th><th>勤務時間</th><th>修正</th></tr></thead>
    <tbody id="history-body"></tbody>
  </table>

  <h3>パスワード変更</h3>
  <label>新しいパスワード</label>
  <input type="password" id="new-password" placeholder="6文字以上">
  <label>新しいパスワード(確認)</label>
  <input type="password" id="new-password-confirm">
  <button onclick="changePassword()">変更する</button>
  <p id="password-message"></p>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>打刻修正申請</h3>
    <p id="modal-date"></p>
    <label>現場</label>
    <select id="req-site-select" onchange="validateCorrectionTimes()"></select>
    <label>出勤時刻</label>
    <input type="time" id="req-clock-in" onchange="validateCorrectionTimes()">
    <label>退勤時刻</label>
    <input type="time" id="req-clock-out" onchange="validateCorrectionTimes()">
    <button onclick="submitCorrection()">申請する</button>
    <button style="background:#9ca3af" onclick="closeModal()">キャンセル</button>
  </div>
</div>

<div class="modal-bg" id="missing-modal-bg">
  <div class="modal">
    <h3>打刻記録の追加申請</h3>
    <p id="missing-modal-date"></p>
    <label>現場</label>
    <select id="missing-site-select" onchange="validateMissingClockIn()"></select>
    <label>出勤時刻</label>
    <input type="time" id="missing-clock-in" onchange="validateMissingClockIn()">
    <p style="font-size:13px; color:#6b7280;">退勤時刻は未入力のまま申請されます(承認後、通常通り退勤ボタンで打刻してください)。</p>
    <button onclick="submitMissingRequest()">申請する</button>
    <button style="background:#9ca3af" onclick="closeMissingModal()">キャンセル</button>
  </div>
</div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
